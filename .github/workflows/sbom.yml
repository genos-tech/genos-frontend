name: SBOM

# CycloneDX software bill of materials (MIP-2269): every package the production
# build pulls in, as a build artifact, so "are we affected by CVE-X?" is a
# search through one file instead of an investigation.
#
# Built from package-lock.json alone (`--package-lock-only`: nothing is
# installed, so no dependency script runs). Dev dependencies are INCLUDED on
# purpose: the bundle is built from them (Vite, SWC, esbuild), so they are part
# of what can compromise the output. Runs on every push to main, and on a PR
# only when this workflow itself changes. Not a required check.

on:
    push:
        branches: [main]
    pull_request:
        paths: [".github/workflows/sbom.yml"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    sbom:
        name: sbom (CycloneDX)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - name: Generate the SBOM from the lock
              run: |
                  npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --package-lock-only \
                    --output-format JSON --output-file sbom.cdx.json
                  node -e "const d = require('./sbom.cdx.json'); console.log(d.bomFormat, d.specVersion, d.components.length, 'components')"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: sbom-genos-frontend-${{ github.sha }}
                  path: sbom.cdx.json
                  if-no-files-found: error
                  retention-days: 90
