name: CI

# Rollout: `frontend-test` was the first check to mark *required*, and
# `frontend-build` is named required too (MIP-898): Railway's deploy runs the
# same `npm run build`, so a red build here is a deploy that cannot ship (it
# happened on 2026-11-02, after a merge with every other check green). It
# only blocks a merge once `frontend-build (required)` is in the ruleset's
# required list, next to `frontend-test`.
# `frontend-quality` stays report-only (non-required) until the ~14k eslint
# findings are separately remediated. Report-only is achieved by leaving the
# check out of branch protection's required list — NOT by
# `continue-on-error` (which would mask a red baseline).
#
# Path filtering happens INSIDE the workflow (the `changes` job below +
# job-level `if`), NOT via `on.pull_request.paths`. The CI checks are
# listed as required-check contexts in the (currently disabled) branch
# ruleset; a trigger-level filter would leave those checks "Expected"
# forever on a docs-only PR and block its merge, whereas a job skipped by
# an `if` condition reports success. Pushes to main are never filtered —
# the deploy job below rides `needs: frontend-test`, and a detection bug
# must never be able to skip a deploy.
#
# `frontend-test` is a thin gate over a 4-way vitest shard matrix, kept as
# its own job so the required context name stays stable. Coverage moved to
# its own report-only job when the tests were sharded. See each job.

on:
    push:
        branches: [main]
    pull_request:

# Least privilege (MIP-727): every job reads the repo and nothing more,
# unless it says otherwise below.
permissions:
    contents: read

concurrency:
    group: frontend-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Classifies the PR's changed files so docs-only PRs skip vitest and the
    # build. FAIL-OPEN by construction: any API hiccup, or any event that is
    # not a pull_request, yields code=true — an unnecessary extra run is
    # noise, but a silently green-skipped test would be a correctness bug.
    # The inert list is a deliberately narrow denylist (never an allowlist:
    # a new top-level config file must default to running CI). Markdown is
    # inert HERE (nothing under src/ imports .md, so neither vitest nor the
    # vite build can see it) — but NOT for `frontend-quality`, which runs
    # `prettier --check .` over md/yaml/json too and therefore stays
    # unconditional.
    changes:
        name: detect relevant changes
        runs-on: ubuntu-latest
        # Listing the PR's files needs this. Without it the call fails and the
        # job fails open, so CI would still run, just on docs-only PRs too.
        permissions:
            contents: read
            pull-requests: read
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - name: Classify changed files (fail-open)
              id: filter
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ "${{ github.event_name }}" != "pull_request" ]; then
                      echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                      --paginate --jq '.[].filename') || files=""
                  if [ -z "$files" ]; then
                      echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  echo "changed files:"; printf '%s\n' "$files"
                  if printf '%s\n' "$files" | grep -Evq '^docs/|\.md$|^LICENSE|^\.gitignore$'; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "code=false" >> "$GITHUB_OUTPUT"
                  fi

    # Vitest, split four ways. The suite is ~45s of work on a dev machine but
    # took 10 MINUTES here, and almost none of that was the test count: a
    # 2-vCPU runner makes vitest choose a single worker (see the pool comment
    # in vite.config.ts), so it ran serially, and this runner is ~2.5x slower
    # per unit of work than a local core on top of that.
    #
    # Two fixes, and this is the second: `vite.config.ts` now floors the pool
    # at 2 workers (214s -> 148s on 2 cores), and the shards below cut the
    # remainder across runners (MIP-1095: three, then four, after the slowest
    # shard was still 4 minutes against 2.5 for the fastest). Shards come out
    # even by file count, because vitest balances by file, not by time.
    #
    # A pull request runs only the tests its change can affect (MIP-1095): the
    # "Choose the tests" step diffs the PR and, when every changed file is a source
    # file `vitest related` can follow, runs just the tests that import one of them,
    # plus every test that reads files from disk (guards and config checks, which
    # have no import to follow). ANYTHING else — a push to main, a config, the
    # lockfile, an asset, a delete or rename, a diff it cannot read — runs the whole
    # suite. See scripts/ci-test-selection.mjs for the rules and why each is there.
    # The shard flag is applied after the selection, so a small change still spreads
    # across the shards.
    #
    # Coverage is deliberately NOT collected here. Combining it across shards
    # needs blob reports plus a merge job, and it gates nothing (no
    # thresholds; it's an uploaded artifact), so it lives in its own
    # report-only job and stays off the path to a merge.
    frontend-test-shards:
        name: frontend-test shard ${{ matrix.shard }}/4
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        strategy:
            # Report every failing shard, not just the first to go red.
            fail-fast: false
            matrix:
                # The count appears three times: this list, the job name above
                # and `--shard=N/4` below. Change them together.
                shard: [1, 2, 3, 4]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # A pull request is checked out as a merge commit, so one
                  # extra commit of history gives the diff against its first
                  # parent, which is exactly what the PR changes.
                  fetch-depth: 2
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            # Fails open: if this step breaks for any reason, no mode is set and
            # the next step runs the whole suite.
            - name: Choose the tests
              id: select
              run: |
                  node scripts/ci-test-selection.mjs --files-out "$RUNNER_TEMP/related.txt" >> "$GITHUB_OUTPUT" \
                      || echo "mode=all" >> "$GITHUB_OUTPUT"
            - name: Vitest (shard ${{ matrix.shard }}/4)
              env:
                  MODE: ${{ steps.select.outputs.mode }}
                  REASON: ${{ steps.select.outputs.reason }}
              run: |
                  echo "Tests: ${MODE:-all} (${REASON:-no selection was made})"
                  {
                      echo "### Frontend tests, shard ${{ matrix.shard }}/4: ${MODE:-all}"
                      echo "${REASON:-no selection was made}"
                  } >> "$GITHUB_STEP_SUMMARY"
                  if [ "$MODE" = "related" ]; then
                      # --passWithNoTests: a small change leaves some shards empty.
                      xargs npx vitest related --run --passWithNoTests \
                          --shard=${{ matrix.shard }}/4 < "$RUNNER_TEMP/related.txt"
                  else
                      npx vitest run --shard=${{ matrix.shard }}/4
                  fi

    # Single stable check context for the shards above.
    #
    # This job exists for its NAME: `frontend-test (required-first)` is listed
    # as a required-check context in the (currently disabled) branch ruleset,
    # and a matrix would report three differently-named contexts instead,
    # leaving the required one "Expected" forever and blocking every merge.
    # The deploy job below also hangs off this id.
    frontend-test:
        name: frontend-test (required-first)
        needs: [changes, frontend-test-shards]
        # `always()` so this still reports on a docs-only PR, where the shards
        # are skipped by the `changes` filter — the whole reason that filtering
        # lives inside the workflow rather than in `on.pull_request.paths`.
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Gate on the shards
              env:
                  # A matrix result is `success` only when every shard passed.
                  SHARDS: ${{ needs.frontend-test-shards.result }}
                  # Both needed, because a skipped shard set is only benign
                  # when `changes` MEANT to skip it: a job whose dependency
                  # died also reports `skipped`, so reading the result alone
                  # would turn a broken `changes` job into a green required
                  # check. Assert why it was skipped, not just that it was.
                  DETECT: ${{ needs.changes.result }}
                  CODE: ${{ needs.changes.outputs.code }}
              run: |
                  echo "detect=$DETECT code=$CODE shards=$SHARDS"
                  if [ "$DETECT" != "success" ]; then
                      echo "::error::change detection did not succeed — refusing to report green"
                      exit 1
                  fi
                  # Fail closed: every path not named here is a failure.
                  if [ "$CODE" = "false" ]; then
                      [ "$SHARDS" = "skipped" ] && exit 0
                      echo "::error::docs-only PR but shards did not skip"
                      exit 1
                  fi
                  [ "$SHARDS" = "success" ] && exit 0
                  echo "::error::vitest shards reported '$SHARDS'"
                  exit 1

    # Coverage, off the critical path: report-only and unsharded, so its
    # runtime never delays a merge. Split out of `frontend-test` when that
    # became sharded (see above).
    frontend-coverage:
        name: frontend-coverage (report-only)
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - name: Vitest + coverage
              run: npx vitest run --coverage
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: frontend-coverage
                  path: coverage/
                  if-no-files-found: ignore

    frontend-build:
        name: frontend-build (required)
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            # Mirrors Railway's build (`tsc -b && vite build`). CI=true so the
            # rollup-plugin-visualizer does not try to open a browser (see
            # vite.config.ts). Confirm Railway's Nixpacks Node major == 22 or
            # this green build does not guarantee a green Railway build.
            #
            # This step also runs `bundleGuard` (scripts/bundleGuard.ts), which
            # FAILS the build if a chunk that must stay lazy — vendor-editor
            # above all — becomes statically reachable from the entry. That has
            # regressed twice. The same failure stops the Railway/Cloud Run
            # deploy build, so this job belongs in the branch ruleset's
            # required list: a violation should be caught at the merge, not
            # discovered afterwards as a deploy that quietly did not ship.
            - name: Build (tsc -b && vite build)
              run: npm run build
              env:
                  CI: "true"
                  # Node's default old-space heap (~2GB) OOMs during vite's
                  # chunk-rendering on this large app; GitHub runners have ~7GB.
                  NODE_OPTIONS: --max-old-space-size=4096

    # Deliberately NOT gated on `changes`: prettier checks `.` — including
    # markdown/yaml/json (.prettierrc's tabWidth applies to them) — so a
    # docs-only PR is exactly the kind of change this job exists to check.
    frontend-quality:
        name: frontend-quality (report-only)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            # Errors fail the gate; the relaxed/stylistic rules are warnings (so no
            # `--max-warnings 0`). Tighten back toward zero warnings as the cleanup
            # pass burns them down.
            - name: ESLint (errors only)
              run: npx eslint .
            - name: Prettier
              if: always() # report both, even if eslint failed
              run: npx prettier --check .

    # Known-vulnerable dependencies (MIP-727), production deps only: what
    # ships in the bundle, plus `serve`, which serves it on Railway.
    # Blocking on high and critical since MIP-751, when the lock reached
    # zero; moderates are listed but don't fail it. An advisory published
    # later turns this red on every PR until the package is bumped (an
    # `overrides` entry in package.json when the parent pins it, as `serve`
    # does `compression`). Reads package-lock.json and installs nothing.
    npm-audit:
        name: npm audit (required)
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - run: npm audit --omit=dev --audit-level=high

    # Build + deploy to GCP Cloud Run on merge to main. Gated on frontend-test
    # (the required check) so a red test never ships. GCP has no other CD for
    # this service, so without this a merged fix stays invisible on GCP until a
    # manual rebuild (this is the drift that hid the findTeam fix). Railway is
    # unaffected — it auto-deploys from its own git integration. Keyless via WIF
    # (needs repo secrets GCP_WIF_PROVIDER + GCP_DEPLOY_SA, same as genos-api).
    #
    # COST SWITCH: deploys only when the repo/org variable DEPLOY_TO_GCP is
    # "true". Unset (the default) = OFF, so merges are Railway-only and never
    # touch GCP. NOTE: this only stops CI from shipping new revisions — it does
    # NOT reduce the GCP bill (Cloud SQL / OpenSearch VM / Redis / warm Cloud Run
    # keep billing regardless). To actually cut cost, pause or tear down the infra
    # (see genos-docs operations/ENVIRONMENTS.md "Going Railway-only (cost)").
    deploy:
        name: deploy to Cloud Run
        needs: [frontend-test]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_TO_GCP == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # mint the WIF OIDC token
        env:
            GCP_PROJECT: amplified-album-496413-t2
            GCP_REGION: asia-northeast1
            AR: asia-northeast1-docker.pkg.dev/amplified-album-496413-t2/genos
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Authenticate to Google Cloud (keyless WIF)
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_DEPLOY_SA }}
            - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
            # VITE_* is baked into the bundle at BUILD time (src/vite-env.d.ts);
            # these are the GCP prod URLs. If the GCP domains change, edit here.
            # VITE_VAPID_PUBLIC_KEY enables browser push — it MUST equal the api's
            # WEBPUSH_VAPID_PRIVATE_KEY pair (var.webpush_vapid_public_key in the
            # genos-platform tfvars). Same keypair as Railway.
            # VITE_POSTHOG_* enables product analytics (services/analytics.ts
            # no-ops without them). Same PostHog project + values as Railway's
            # frontend service — the key is a PUBLIC client-side value (it ships
            # in the served bundle), so plaintext here is fine, same as the
            # VAPID public key.
            - name: Build + push frontend image (amd64 — Cloud Run requires it)
              run: |
                  gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
                  docker build --platform linux/amd64 -f Dockerfile.cloudrun \
                      --build-arg VITE_API_BASE_URL=https://api.gcp.genosai.dev/api/v2 \
                      --build-arg VITE_DJANGO_URL=https://api.gcp.genosai.dev \
                      --build-arg VITE_MEDIA_ROOT_DJANGO=https://api.gcp.genosai.dev/media \
                      --build-arg VITE_WS_BASE_URL=https://ws.gcp.genosai.dev \
                      --build-arg VITE_COLLAB_URL=wss://collab.gcp.genosai.dev \
                      --build-arg VITE_VAPID_PUBLIC_KEY=BFfrZoXdO5uF3bau2e5k0ltJb8UF07RgFBDrlI6_kg323Z7OXO_DxjH_fiSmH_4XLOPPlgqOP9KvbFs4mgE4vrg \
                      --build-arg VITE_POSTHOG_KEY=phc_D7PN7v2vhj4ijkcHdpzjCfuk788b9GNQwCjcssN7k7SC \
                      --build-arg VITE_POSTHOG_HOST=https://us.i.posthog.com \
                      -t "$AR/frontend:${GITHUB_SHA}" -t "$AR/frontend:latest" .
                  docker push "$AR/frontend:${GITHUB_SHA}"
                  docker push "$AR/frontend:latest"
            - name: Deploy to Cloud Run
              run: |
                  gcloud run deploy genos-frontend \
                      --project "$GCP_PROJECT" --region "$GCP_REGION" \
                      --image "$AR/frontend:${GITHUB_SHA}"
