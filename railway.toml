[build]
# Pin Nixpacks explicitly: a Dockerfile now exists (for Cloud Run/GCP), and
# without this Railway auto-detects it and switches off Nixpacks — which breaks
# this service's `serve` startCommand. Railway must keep using Nixpacks here.
builder = "NIXPACKS"
# Nixpacks' install phase already ran `npm ci` (exactly the lock, cached on
# ~/.npm). Do not add `npm install` here: it can resolve versions the lock does
# not name (MIP-752). The cache mount Nixpacks adds for this phase is on
# node_modules/.cache, not node_modules, so there is no EBUSY (commit 74450ef7
# was about Railpack).
buildCommand = "npm run build"

[deploy]
# `exec` + the local binary, not `npx`: npm sat between Railway and `serve` and logged
# "npm error signal SIGTERM" on every deploy (MIP-921). `serve` is a dependency.
startCommand = "exec ./node_modules/.bin/serve -s dist -l $PORT"
restartPolicyType = "ON_FAILURE"
