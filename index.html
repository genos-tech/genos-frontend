<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- Favicon can be the raw mark: browsers honour transparency. -->
        <link rel="icon" type="image/png" href="/genos-logo.png" />
        <!-- Home-screen / dock icon. NOT the raw mark, and not optional:
             Safari gives this precedence over the manifest icons, and with
             no such tag iOS screenshots the page instead. It also has to be
             square and opaque — iOS fills transparency with a colour of its
             own choosing (black), which would swallow the dark purple mark.
             Generated by `scripts/generate-app-icons.mjs`. -->
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#7c3aed" />
        <!-- viewport-fit=cover lets the app extend into device cutout areas,
             which is what makes the env(safe-area-inset-*) paddings (bottom
             tab bar, FAB, overlays) actually resolve to non-zero values. -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <!-- iOS treats a page as installable-to-standalone via these (plus the
             manifest). Web Push on iOS only works in an installed PWA, so
             without them the push stack is unreachable for iPhone users.
             status-bar-style stays "default" (opaque) so content never sits
             under the status bar — nothing pads safe-area-inset-top yet. -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Genos" />
        <title>Genos</title>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
