<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- Favicon can be the raw mark: browsers honour transparency. -->
        <link rel="icon" type="image/png" href="/genos-logo.png" />
        <!-- Home-screen / dock icon. NOT the raw mark, and not optional:
             Safari gives this precedence over the manifest icons, and with
             no such tag iOS screenshots the page instead. It also has to be
             square and opaque — iOS fills transparency with a colour of its
             own choosing (black), which would swallow the dark purple mark.
             Generated by `scripts/generate-app-icons.mjs`. -->
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#7c3aed" />
        <!-- viewport-fit=cover lets the app extend into device cutout areas,
             which is what makes the env(safe-area-inset-*) paddings (bottom
             tab bar, FAB, overlays) actually resolve to non-zero values.
             minimum-scale=1 keeps the LAYOUT viewport at the device width: without
             it one element that overflows (a wide code block, table or URL) makes a
             phone widen the layout viewport (390 -> 523 measured, MIP-1196), and
             every fixed overlay (toast, banner, FAB) is then centred on the wider
             box and partly off the screen. The page may still be zoomed IN. -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover"
        />
        <!-- iOS treats a page as installable-to-standalone via these (plus the
             manifest). Web Push on iOS only works in an installed PWA, so
             without them the push stack is unreachable for iPhone users.
             status-bar-style stays "default" (opaque) so content never sits
             under the status bar — nothing pads safe-area-inset-top yet. -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Genos" />
        <title>Genos</title>
        <!-- What a crawler or link-preview bot that does NOT run JavaScript receives for
             every URL on the site, because this one file is served for all of them
             (`serve -s`). Per-page title, description, canonical and hreflang are set
             after mount by `useDocumentMeta` (src/lp/useDocumentMeta.ts), which only
             JavaScript-rendering crawlers and browsers see. So this block states only
             what is true of every page: the name and the share image. It deliberately
             has no description, canonical or og:url (they would be wrong on all but one
             route) and no tagline (the headline wording is not decided yet).
             The image is regenerated by `npm run seo:share-image`. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Genos" />
        <meta property="og:title" content="Genos" />
        <meta property="og:image" content="https://genosai.dev/genos-share.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Genos" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Genos" />
        <meta name="twitter:image" content="https://genosai.dev/genos-share.png" />
        <!-- Structured data: only facts the site itself shows (name, address, logo,
             that it is a web app). No ratings, prices or offers. A data block, not
             a script, so the CSP's script-src does not apply to it. -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "Organization",
                        "@id": "https://genosai.dev/#organization",
                        "name": "Genos",
                        "url": "https://genosai.dev",
                        "logo": "https://genosai.dev/genos-logo.png"
                    },
                    {
                        "@type": "SoftwareApplication",
                        "@id": "https://genosai.dev/#app",
                        "name": "Genos",
                        "url": "https://genosai.dev",
                        "applicationCategory": "BusinessApplication",
                        "operatingSystem": "Web",
                        "publisher": { "@id": "https://genosai.dev/#organization" }
                    }
                ]
            }
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
